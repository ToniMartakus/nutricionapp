name: Publicar función segura en Supabase

on:
  push:
    branches: [main]
    paths:
      - "app/api/recipes/route.ts"
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: cebqvzwdrsfgbjyxcpss
    steps:
      - name: Descargar el código
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Preparar Supabase
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest
      - name: Publicar generate-recipes
        run: supabase functions deploy generate-recipes --project-ref "$SUPABASE_PROJECT_ID"
